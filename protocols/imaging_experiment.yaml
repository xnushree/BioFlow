# Time-lapse imaging: image every 6 hours over 18 hours.
# Imaging-heavy, so it stresses the imaging stations.
# synchronize: every plate is imaged at the same time point: no plate starts an
# IMAGE step until all plates in the experiment have finished the incubation before it.
protocol: imaging_experiment
cell_type: iPSC
description: Three incubate-then-image cycles, with a longer imaging time.

conditions:
  temperature_c: 37.0
  co2_pct: 5.0

steps:
  - operation: INCUBATE
    duration_min: 360
  - operation: IMAGE
    duration_min: 20
    synchronize: true
  - operation: INCUBATE
    duration_min: 360
  - operation: IMAGE
    duration_min: 20
    synchronize: true
  - operation: INCUBATE
    duration_min: 360
  - operation: IMAGE
    duration_min: 20
    synchronize: true
  - operation: ARCHIVE
