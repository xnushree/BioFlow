# Scheduler settings. Only the cost-based scheduler has tunable parameters.
#
#   J = travel*travel_min + switching*switch - delay*waited_min
#       - idle*dest_idle_min - deadline*critical_ratio        (lower J is dispatched first)
#
# These weights are a hand-tuned starting point, not an optimum.
cost:
  weights:
    travel: 1.0       # per minute of robot travel
    switching: 5.0    # per cell-type change at a media/imaging station
    delay: 0.05       # per minute a task has been waiting
    idle: 0.01        # per minute the destination has been unassigned
    deadline: 50.0    # per unit of critical ratio (remaining work / time left)
  default_step_min: 15.0
  max_critical_ratio: 10.0
